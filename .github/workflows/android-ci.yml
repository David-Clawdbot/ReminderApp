name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@main
        with:
          gradle-version: 8.2

      - name: Setup Android SDK
        run: |
          mkdir -p /opt/android-sdk
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/
          mkdir -p /opt/android-sdk/cmdline-tools/latest
          mv /tmp/cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || {
            echo "=== BUILD FAILED ==="
            echo "Checking for local.properties..."
            ls -la local.properties 2>/dev/null || echo "No local.properties"
            echo "Checking build.gradle..."
            cat build.gradle 2>/dev/null || echo "No build.gradle"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
